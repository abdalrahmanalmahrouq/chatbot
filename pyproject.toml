[project]
name = "chatbot"
version = "0.1.0"
description = "AI chat platform microservices"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.16.5",
    "fastapi==0.116.1",
    "httpx==0.28.1",
    "langgraph==0.6.6",
    "pydantic==2.11.7",
    "pydantic-settings==2.10.1",
    "sqlalchemy==2.0.43",
    "uvicorn==0.35.0",
]

[dependency-groups]
dev = [
    "pytest==8.4.1",
    "ruff==0.12.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
